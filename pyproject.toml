[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclose-denoising"
version = "0.1.0"
description = "fMRI denoising pipeline for OpenClose project"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "OpenClose Project Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.10.0,<2.0.0",
    "nilearn>=0.10.0,<0.11.0",
    "nibabel>=5.0.0,<6.0.0",
    "pybids>=0.16.0,<0.17.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<0.14.0",
    "scikit-learn>=1.3.0,<1.5.0",
    "tqdm>=4.65.0,<5.0.0",
    "requests>=2.28.0,<3.0.0",
    "pathlib>=1.0.0; python_version < '3.4'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=23.0.0,<24.0.0",
    "flake8>=6.0.0,<7.0.0",
    "mypy>=1.5.0,<2.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "ipykernel>=6.0.0,<7.0.0",
]
docs = [
    "sphinx>=7.0.0,<8.0.0",
    "sphinx-rtd-theme>=1.3.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/example/openclose-denoising"
Repository = "https://github.com/example/openclose-denoising.git"
Issues = "https://github.com/example/openclose-denoising/issues"

[tool.setuptools]
packages = ["denoising"]

[tool.setuptools.package-dir]
"" = "."

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["denoising/test", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[project.scripts]
openclose-denoise = "run_denoise:main"